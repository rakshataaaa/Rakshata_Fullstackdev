<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/forms.css">
    <title>Register | SkillSwapy</title>
</head>

<body>
    <!-- (Reuse your navbar from index.html here) -->
    <div class="form-container">
        <h2>Create an Account</h2>
        <form id="registerForm">
            <div class="form-group"><input type="text" id="name" placeholder="Full Name" required></div>
            <div class="form-group"><input type="email" id="email" placeholder="Email" required></div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="form-group" style="font-size: 0.9rem; margin-bottom: 15px;">
                <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                    <input type="checkbox" id="showPwd" onclick="togglePassword()"
                        style="width: 20px; height: 20px; margin: 0;">
                    <label for="showPwd" style="margin: 0; cursor: pointer; display: inline; width: auto;">Show
                        Password</label>
                </div>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>
    <script src="../js/auth.js"></script>
</body>

</html>
